<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img">
<title>Plinth system overview</title>
<desc>One Docker container holding an HTTP API, a CLI and the core library. LASTLOOK's feed sync calls the HTTP API at ingest and CF's scraper calls the CLI. Both go through the core, whose outputs land in Azure Blob for LASTLOOK tiles or in CF's own storage.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.th{font-size:14px;font-weight:500;fill:#1f1f1e}
.ts{font-size:12px;fill:#5f5e5a}
.box{fill:#f7f6f2;stroke:#c9c7bf;stroke-width:0.75}
.blue{fill:#eef4fb;stroke:#4a80c4;stroke-width:0.75}
.teal{fill:#e6f4f3;stroke:#2f8f87;stroke-width:0.75}
.amber{fill:#fdf3e1;stroke:#d99a2b;stroke-width:0.75}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="blue" x="210" y="130" width="290" height="272" rx="20"/>
<text class="th" x="355" y="152" text-anchor="middle" dominant-baseline="central">plinth container</text>
<text class="ts" x="355" y="170" text-anchor="middle" dominant-baseline="central">one Docker image, both sides</text>
<rect class="teal" x="230" y="184" width="110" height="56" rx="10"/>
<text class="th" x="285" y="202" text-anchor="middle" dominant-baseline="central">HTTP API</text>
<text class="ts" x="285" y="222" text-anchor="middle" dominant-baseline="central">on demand</text>
<rect class="teal" x="360" y="184" width="120" height="56" rx="10"/>
<text class="th" x="420" y="202" text-anchor="middle" dominant-baseline="central">CLI</text>
<text class="ts" x="420" y="222" text-anchor="middle" dominant-baseline="central">batch mode</text>
<rect class="amber" x="230" y="272" width="240" height="110" rx="10"/>
<text class="th" x="350" y="300" text-anchor="middle" dominant-baseline="central">Core library</text>
<text class="ts" x="350" y="322" text-anchor="middle" dominant-baseline="central">trim, canvas, verdict</text>
<text class="ts" x="350" y="344" text-anchor="middle" dominant-baseline="central">keyed by hash + version</text>
<line x1="285" y1="240" x2="285" y2="262" class="arr" marker-end="url(#arrow)"/>
<line x1="420" y1="240" x2="420" y2="262" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="360" y="60" width="120" height="56" rx="8"/>
<text class="th" x="420" y="78" text-anchor="middle" dominant-baseline="central">CF scraper</text>
<text class="ts" x="420" y="98" text-anchor="middle" dominant-baseline="central">their pipeline</text>
<line x1="420" y1="116" x2="420" y2="174" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="30" y="184" width="150" height="56" rx="8"/>
<text class="th" x="105" y="202" text-anchor="middle" dominant-baseline="central">Feed sync</text>
<text class="ts" x="105" y="222" text-anchor="middle" dominant-baseline="central">LASTLOOK, at ingest</text>
<line x1="180" y1="212" x2="220" y2="212" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="510" y="272" width="140" height="56" rx="8"/>
<text class="th" x="580" y="290" text-anchor="middle" dominant-baseline="central">Azure Blob</text>
<text class="ts" x="580" y="310" text-anchor="middle" dominant-baseline="central">our tiles read it</text>
<line x1="470" y1="300" x2="500" y2="300" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="510" y="340" width="140" height="56" rx="8"/>
<text class="th" x="580" y="358" text-anchor="middle" dominant-baseline="central">CF storage</text>
<text class="ts" x="580" y="378" text-anchor="middle" dominant-baseline="central">their own bucket</text>
<line x1="470" y1="368" x2="500" y2="368" class="arr" marker-end="url(#arrow)"/>
</svg>
